CLASS_NAMES: ['Car', 'Pedestrian', 'Bus', 'PickupTruck', 'MediumTruck', 'SemiTruck', 'TowedObject', 'Cyclist', 'Scooter', 'Train', 'Motorcycle']

DATA_CONFIG:
    _BASE_CONFIG_: cfgs/dataset_configs/custom_dataset.yaml
    POINT_CLOUD_RANGE: [-51.2, -60, -3, 51.2, 40.8, 5]

    ENABLE_MULTIMODAL: False   # LiDAR-only baseline，禁用图像分支

    DATA_PROCESSOR:
        - NAME: mask_points_and_boxes_outside_range
          REMOVE_OUTSIDE_BOXES: True

        - NAME: shuffle_points
          SHUFFLE_ENABLED: {
            'train': True,
            'test': False
          }

        - NAME: transform_points_to_voxels
          # 3D voxel（非pillar），Z方向分层
          # 范围: X=102.4m, Y=101.12m, Z=8m
          # Grid: 1024 x 1011 x 40 -> 经过 VoxelBackBone8x(8x): 128 x 126 x 5
          VOXEL_SIZE: [0.1, 0.1, 0.2]
          MAX_POINTS_PER_VOXEL: 5
          MAX_NUMBER_OF_VOXELS: {
            'train': 80000,
            'test': 90000
          }

    DATA_AUGMENTOR:
        DISABLE_AUG_LIST: ['placeholder']
        AUG_CONFIG_LIST:
            - NAME: gt_sampling
              USE_ROAD_PLANE: False
              DB_INFO_PATH:
                  - custom_dbinfos_train.pkl
              PREPARE: {
                  filter_by_min_points: [
                      'Car:5',
                      'Pedestrian:1',
                      'Bus:5',
                      'PickupTruck:5',
                      'MediumTruck:5',
                      'SemiTruck:5',
                      'TowedObject:5',
                      'Cyclist:3',
                      'Scooter:3',
                      'Train:5',
                      'Motorcycle:3',
                  ],
                  filter_by_difficulty: [-1],
              }
              SAMPLE_GROUPS: [
                  'Car:15',
                  'Pedestrian:10',
                  'Bus:10',
                  'PickupTruck:10',
                  'MediumTruck:10',
                  'SemiTruck:5',
                  'TowedObject:5',
                  'Cyclist:10',
                  'Scooter:5',
                  'Train:5',
                  'Motorcycle:3',
              ]
              NUM_POINT_FEATURES: 4
              DATABASE_WITH_FAKELIDAR: False
              REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
              LIMIT_WHOLE_SCENE: False

            - NAME: random_world_flip
              ALONG_AXIS_LIST: ['x']

            - NAME: random_world_rotation
              WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

            - NAME: random_world_scaling
              WORLD_SCALE_RANGE: [0.95, 1.05]


MODEL:
    NAME: SECONDNet

    VFE:
        NAME: MeanVFE   # SECOND 用均值VFE，无学习参数，直接平均体素内点特征

    BACKBONE_3D:
        NAME: VoxelBackBone8x   # 3D稀疏卷积骨干，8x下采样

    MAP_TO_BEV:
        NAME: HeightCompression
        NUM_BEV_FEATURES: 256   # Z维度压缩后 BEV 特征数 = 256/stride

    BACKBONE_2D:
        NAME: BaseBEVBackbone
        LAYER_NUMS: [5, 5]
        LAYER_STRIDES: [1, 2]
        NUM_FILTERS: [128, 256]
        UPSAMPLE_STRIDES: [1, 2]
        NUM_UPSAMPLE_FILTERS: [256, 256]

    DENSE_HEAD:
        NAME: AnchorHeadSingle
        CLASS_AGNOSTIC: False
        USE_DIRECTION_CLASSIFIER: True
        DIR_OFFSET: 0.78539
        DIR_LIMIT_OFFSET: 0.0
        NUM_DIR_BINS: 2

        # ⚠️ 关键：feature_map_stride 改为 8（VoxelBackBone8x 下采样8倍）
        # anchor 尺寸与 PointPillar 保持一致（便于公平对比）
        ANCHOR_GENERATOR_CONFIG: [
            {
                'class_name': 'Car',
                'anchor_sizes': [[4.5, 1.75, 1.56]],
