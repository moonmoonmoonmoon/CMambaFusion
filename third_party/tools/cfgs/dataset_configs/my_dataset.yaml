  'Truck': 'Bigcar',
  'FLATBED_TRUCK': 'Bigcar',
  'DUMP_TRUCK': 'Bigcar',
  'SEMI_TRUCK': 'Bigcar',
  'CONSTRUCTION_TRUCK': 'Bigcar',
  'SPECIAL_VEHICLE': 'Bigcar',
  'Special_ vehicles': 'Bigcar',
  'Cyclist':'Cyclist',
  'BICYCLE': 'Cyclist',
  'Bicycle': 'Cyclist',
  'Cycle': 'Cyclist',
  'MOTORCYCLE': 'Cyclist',
  'TRICYCLE': 'Cyclist',
  'Tricyclist': 'Tricyclist',
  'Pedestrian': 'Pedestrian',
  'PED_ADULT': 'Pedestrian',
  'PED_CHILD': 'Pedestrian',
  'BABY_CARRIAGE': 'Pedestrian',
  'ANIMAL': 'unknown',
