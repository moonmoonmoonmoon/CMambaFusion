DATASET: 'MyDataset'
DATA_PATH: '../data/my_data'

POINT_CLOUD_RANGE: [0, -40, -3, 70.4, 40, 1]

DATA_SPLIT: {
    'train': train,
    'test': val
}

INFO_PATH: {
    'train': [my_infos_train.pkl],
    'test': [my_infos_val.pkl],
}

GET_ITEM_LIST: ["points"]
DATA_COMPOSITION: ["pcd"]
FOV_POINTS_ONLY: True

GT_NAME_REMAP: {
  'Vehicle':'Vehicle',
  'CAR': 'Vehicle', 
  'Car': 'Vehicle', 
  'VAN': 'Vehicle',
  'Van': 'Vehicle',
